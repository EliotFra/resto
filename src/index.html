<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIEMZ</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>tiemz</h1>
      <nav class="header-nav">
        <a href="" class="header-nav-link">Menu</a>
        <a href="" class="header-nav-link">Qui sommes-nous ?</a>
        <a href="" class="header-nav-link">Réserver</a>
      </nav>
    </header>
    <div class="form">
      <h2 class="form-title">Réserver une table</h2>
      <form class="form-fields">
        <div class="form-field">
          <label for="Nom">Nom</label>
          <input
            class="form-field-input"
            id="Nom"
            type="text"
            placeholder="Camille Martin"
          />
        </div>
        <div class="form-field">
          <label for="E-mail">E-mail</label>
          <input
            class="form-field-input"
            id="email"
            type="email"
            placeholder="camille@exemple.ch"
          />
        </div>
        <div class="form-reservation">
          <div class="form-field">
            <label for="date">Date</label>
            <input
              class="form-field-input"
              id="date"
              type="date"
              placeholder="12.06.2026"
            />
          </div>
          <div class="form-field">
            <label for="time">Heure</label>
            <input
              class="form-field-input"
              id="time"
              type="time"
              placeholder="19h30"
            />
          </div>
          <div class="form-field">
            <label for="number">Personnes</label>
            <input
              class="form-field-input"
              id="number"
              type="number"
              placeholder="2"
              min="1"
              max="10"
            />
          </div>
        </div>
      </form>
      <button type="submit" class="form-button">Réserver</button>
    </div>
  </body>
</html>
